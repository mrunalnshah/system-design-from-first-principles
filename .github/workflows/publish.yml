# Publish the website (specs/operations.md#deploy, specs/security.md).
#
# Every push to main is checked, built and, only if all of that passed, deployed to GitHub Pages.
# Pull requests are checked and built but never deployed. There are no path filters: a push that
# only touches Obsidian settings still builds and deploys (REQ-SITE-007.AC3).
#
# Supply chain: every Action is pinned to a full commit SHA (tag in the comment, verified on
# 2026-11-26), and each job gets only the permissions it needs.
name: publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: .site

jobs:
  checks:
    name: Lint, types, tests, plan
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: .site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Module boundaries (TOOL-06)
        run: npm run lint:boundaries
      - run: npm run check
      - run: npm test
      - name: Plan check (TOOL-03)
        run: npm run tools -- check

  secrets:
    name: Secret scan (gitleaks)
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # Pinned SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz (from the v8.30.1 release, 2026-11-26).
      # Checked in addition to the release's checksums file, so a re-uploaded release can't slip through.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history: anything ever pushed stays public
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          mkdir -p .tools/gitleaks && cd .tools/gitleaks
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          echo "${GITLEAKS_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan the whole history
        run: .tools/gitleaks/gitleaks git --redact --no-banner --config ../.gitleaks.toml ..
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: .site/package-lock.json
      - run: npm ci
      - name: The pre-commit hook blocks a secret (TOOL-13)
        run: npx vitest run tests/secrets.test.ts
        env:
          REQUIRE_GITLEAKS: "1"

  build:
    name: Build
    needs: [checks, secrets]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: .site/package-lock.json
      - run: npm ci
      - run: npm run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .site/dist

  deploy:
    name: Deploy to GitHub Pages
    # Only pushes to main (and manual runs on main) go live; a failed check or build never gets here.
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
