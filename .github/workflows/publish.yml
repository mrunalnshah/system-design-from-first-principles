# Publish the website (specs/operations.md#deploy, specs/security.md).
#
# Every push to main is checked, built and, only if all of that passed, deployed to GitHub Pages.
# Pull requests from this repository are checked and built but never deployed; pull requests from forks don't
# run at all (security.md B2). There are no path filters: a push that only touches Obsidian settings still
# builds and deploys (REQ-SITE-007.AC3).
#
# Supply chain: every Action is pinned to a full commit SHA (tag in the comment, verified on
# 2026-11-26), and each job gets only the permissions it needs.
name: publish

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1" # Mondays 06:17 UTC: catch new advisories even in weeks without pushes (TOOL-14)

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

defaults:
  run:
    working-directory: .site

jobs:
  # The first three jobs skip pull requests from forks (security.md B2: only pushes and same-repository pull
  # requests run), and the build and deploy need them, so a fork's code never runs here at all.
  checks:
    name: Lint, types, tests, plan, audit
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the audit compares the lockfile with the previous commit
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: .site/package-lock.json
      - run: npm ci
      - run: npm run lint
      - name: Module boundaries (TOOL-06)
        run: npm run lint:boundaries
      - run: npm run check
      - name: Browser for the layout tests (Playwright's Chromium)
        run: npx playwright install --with-deps chromium
      - run: npm test
      - name: Plan check (TOOL-03)
        run: npm run tools -- check
      - name: Dependency audit (TOOL-14)
        env:
          # The commit to compare the lockfile with: a PR's base (never the previous PR push, so a
          # re-push can't skip a failed check), else the previous push. Empty on scheduled runs
          # (advisories and licences only). A base the repo doesn't have fails the audit.
          # Known limit: on main, a push after a failed run compares with that failed push; the
          # local `min-release-age=7` in .npmrc and Dependabot's cooldown still guard new versions.
          AUDIT_BASE: ${{ github.event.pull_request.base.sha || github.event.before || '' }}
        run: |
          base="$AUDIT_BASE"
          if [ "$base" = "0000000000000000000000000000000000000000" ]; then base="HEAD~1"; fi
          npm run tools -- audit ${base:+--base "$base"}

  secrets:
    name: Secret scan (gitleaks)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GITLEAKS_VERSION: 8.30.1
      # Pinned SHA-256 of gitleaks_8.30.1_linux_x64.tar.gz (from the v8.30.1 release, 2026-11-26).
      # Checked in addition to the release's checksums file, so a re-uploaded release can't slip through.
      GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # the whole history: anything ever pushed stays public
          persist-credentials: false
      - name: Install gitleaks (checksum-verified)
        run: |
          mkdir -p .tools/gitleaks && cd .tools/gitleaks
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -fsSLO "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz$" "gitleaks_${GITLEAKS_VERSION}_checksums.txt" | sha256sum -c -
          echo "${GITLEAKS_SHA256}  gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sha256sum -c -
          tar -xzf "gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" gitleaks
      - name: Scan the whole history
        run: .tools/gitleaks/gitleaks git --redact --no-banner --config ../.gitleaks.toml ..
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: .site/package-lock.json
      - run: npm ci
      - name: The pre-commit hook blocks a secret (TOOL-13)
        run: npx vitest run tests/secrets.test.ts
        env:
          REQUIRE_GITLEAKS: "1"

  e2e:
    name: Screen tests (TOOL-09)
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: .site/package-lock.json
      - run: npm ci
      - name: Browser (Playwright's Chromium)
        run: npx playwright install --with-deps chromium
      - name: Light and dark, JavaScript on and off, at 320, 768 and 1280 px
        run: npm run test:e2e

  build:
    name: Build, size, links, Lighthouse
    needs: [checks, secrets, e2e]
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 26.13.1
          cache: npm
          cache-dependency-path: .site/package-lock.json
      - run: npm ci
      # A build error (a broken embed, say) fails this step, so nothing is uploaded and the live site stays as it
      # was (REQ-SITE-007.AC2). The log is kept for the next step; an explicit `shell: bash` runs with
      # `-eo pipefail`, so the build's own exit code still fails the step through tee.
      - name: Build
        id: build
        shell: bash
        run: npm run build 2>&1 | tee build.log
      - name: Build errors on the run page (REQ-SITE-007.AC2, REQ-CNT-007)
        if: failure() && steps.build.outcome == 'failure'
        # The build report (specs/contracts/build-messages.md) from its first issue to its summary line, into the
        # job summary that GitHub shows on the run page; the whole log stays in the Build step. A build that stopped
        # without a report (Astro itself failed) shows the end of its log instead. A ~~~~ fence, so no file name can
        # close it.
        run: |
          {
            echo "### The build stopped, so nothing was published"
            echo
            echo '~~~~'
            if grep -q '^✖ ERROR ' build.log; then
              sed -n '/^✖ ERROR \|^⚠ WARNING /,/^The build found /p' build.log
            else
              tail -n 40 build.log
            fi
            echo '~~~~'
          } >> "$GITHUB_STEP_SUMMARY"
      # The guards on what gets published; any of them failing stops the deploy (T-01.20).
      - name: Build size (TOOL-11, NFR-002)
        run: npm run tools -- size
      - name: Links under the base path (TOOL-12, REQ-SITE-013)
        run: npm run tools -- links
      - name: Lighthouse budgets (TOOL-10, NFR-001; the runner's own Chrome, results in the job summary)
        run: npm run test:lighthouse
      # The same build at the book's planned size: a generated vault of 60 chapters and 100 articles, timed, then
      # every page of it checked against the size budgets. Built outside .site/, so the upload below is untouched.
      # It runs warm, after the real build in this job (Vite and npm caches); the margin is wide (about 12 s
      # locally against 120 s). After Lighthouse, so its failure never hides the Lighthouse table.
      - name: Build time at full size (TOOL-16, NFR-006, NFR-002)
        shell: bash
        run: |
          npm run tools -- gen-vault "$RUNNER_TEMP/vault-60" --chapters 60 --articles 100
          start=$(date +%s)
          SDFP_VAULT="$RUNNER_TEMP/vault-60" npm run build -- --outDir "$RUNNER_TEMP/dist-60"
          took=$(( $(date +%s) - start ))
          echo "Full-size build (60 chapters, 100 articles): ${took} s, budget 120 s (NFR-006)." | tee -a "$GITHUB_STEP_SUMMARY"
          if [ "$took" -gt 120 ]; then echo "::error::The full-size build took ${took} s, over the 2-minute budget (NFR-006)."; exit 1; fi
          npm run tools -- size --dist "$RUNNER_TEMP/dist-60"
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: .site/dist

  deploy:
    name: Deploy to GitHub Pages
    # Only pushes to main (and manual runs on main) go live; a failed check or build never gets here,
    # and scheduled audit runs never deploy.
    if: (github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
